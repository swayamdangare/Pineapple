name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unpack project zips
        run: |
          mkdir -p build_src
          for f in $(ls *.zip | sort); do unzip -o "$f" -d build_src; done
      - name: Build
        working-directory: build_src
        run: gradle assembleDebug --no-daemon
      - name: Save APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassLauncher-APK
          path: build_src/app/build/outputs/apk/debug/*.apk
      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: build_src/app/build/outputs/apk/debug/app-debug.apk
